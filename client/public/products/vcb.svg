<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="14" fill="#F8FAFC" />
  <!-- VCB Chassis / Mechanism Box -->
  <rect x="22" y="32" width="56" height="48" rx="4" fill="#0284C7" stroke="#0369A1" stroke-width="2"/>
  <!-- 3 Vacuum Interrupter Spouts / Poles -->
  <rect x="26" y="10" width="12" height="24" rx="3" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
  <rect x="44" y="10" width="12" height="24" rx="3" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
  <rect x="62" y="10" width="12" height="24" rx="3" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
  <!-- Tulip Contacts on top -->
  <rect x="28" y="6" width="8" height="6" rx="1" fill="#E2E8F0"/>
  <rect x="46" y="6" width="8" height="6" rx="1" fill="#E2E8F0"/>
  <rect x="64" y="6" width="8" height="6" rx="1" fill="#E2E8F0"/>
  <!-- Mechanism Window & Pushbuttons -->
  <rect x="36" y="44" width="28" height="18" rx="2" fill="#0F172A"/>
  <circle cx="43" cy="53" r="4" fill="#22C55E"/>
  <circle cx="57" cy="53" r="4" fill="#EF4444"/>
  <!-- Truck Wheels -->
  <circle cx="30" cy="84" r="5" fill="#475569" stroke="#1E293B" stroke-width="2"/>
  <circle cx="70" cy="84" r="5" fill="#475569" stroke="#1E293B" stroke-width="2"/>
  <!-- Rating -->
  <text x="50" y="73" font-family="sans-serif" font-size="5" font-weight="900" fill="#FFFFFF" text-anchor="middle">11kV 630A</text>
</svg>