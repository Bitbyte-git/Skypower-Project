<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="14" fill="#F8FAFC" />
  <!-- Panel Enclosure Box (RAL 7035 Grey) -->
  <rect x="18" y="14" width="64" height="72" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <rect x="22" y="18" width="56" height="64" rx="3" fill="#CBD5E1"/>
  <!-- Top 3 Indicator Lamps (R, Y, B) -->
  <circle cx="34" cy="30" r="4.5" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  <circle cx="50" cy="30" r="4.5" fill="#EAB308" stroke="#A16207" stroke-width="1"/>
  <circle cx="66" cy="30" r="4.5" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1"/>
  <!-- Digital Meter Window -->
  <rect x="36" y="42" width="28" height="16" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="50" y="52" font-family="monospace" font-size="5" fill="#22C55E" text-anchor="middle">415 V</text>
  <!-- Push Buttons (START/STOP) -->
  <circle cx="38" cy="68" r="5" fill="#22C55E" stroke="#15803D" stroke-width="1"/>
  <circle cx="62" cy="68" r="5" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  <!-- Panel Door Keylock -->
  <circle cx="72" cy="50" r="2.5" fill="#475569"/>
</svg>