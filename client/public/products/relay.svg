<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="14" fill="#F8FAFC" />
  <!-- Relay Bezel (Black) -->
  <rect x="18" y="14" width="64" height="72" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <!-- Front Display Area (Grey) -->
  <rect x="24" y="20" width="52" height="60" rx="3" fill="#1E293B"/>
  <!-- Backlit LCD Screen -->
  <rect x="28" y="24" width="44" height="22" rx="2" fill="#065F46" stroke="#047857" stroke-width="1"/>
  <text x="50" y="34" font-family="monospace" font-size="5" fill="#34D399" text-anchor="middle">I> 630A</text>
  <text x="50" y="42" font-family="monospace" font-size="4.5" fill="#A7F3D0" text-anchor="middle">NORMAL 50Hz</text>
  <!-- Navigation / Trip Keypad Buttons -->
  <circle cx="36" cy="56" r="3.5" fill="#475569"/>
  <circle cx="50" cy="56" r="3.5" fill="#475569"/>
  <circle cx="64" cy="56" r="3.5" fill="#475569"/>
  <circle cx="43" cy="68" r="4" fill="#22C55E"/>
  <circle cx="57" cy="68" r="4" fill="#EF4444"/>
  <!-- RS485 Comm Indicator -->
  <circle cx="68" cy="23" r="1.5" fill="#22C55E"/>
</svg>